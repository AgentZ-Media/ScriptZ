name: Release

on:
  push:
    tags:
      - 'v*.*.*'
      - '!v*.*.*.*'

permissions:
  contents: write

jobs:
  build:
    name: Build macOS (Apple Silicon)
    # Pin to macos-26 (Tahoe) so the SDK matches what users see locally
    # on Tahoe — the Sequoia SDK shifts the traffic-light cluster a few
    # pixels and the chrome stops looking pixel-identical to `pnpm
    # tauri dev`. macos-26 has been GA on GitHub-hosted runners since
    # 2026-02-26.
    runs-on: macos-26

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/desktop/src-tauri

      - name: Setup pnpm
        # Version kommt aus packageManager in der Repo-Root-package.json,
        # damit lokal und CI dieselbe pnpm-Version benutzen. Keine Angabe
        # hier - sonst kollidieren beide Quellen (ERR_PNPM_BAD_PM_VERSION).
        uses: pnpm/action-setup@v6

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build release body
        # Setzt zusammen: per-Version-Changelog + statische Install-Footer.
        # Beide kommen aus checked-in Files (docs/release-notes/), damit
        # die Release-Beschreibung versionierbar bleibt und nicht im
        # Workflow-YAML verstaut. Fehlt die Tag-spezifische Datei,
        # bricht der Workflow mit klarem Error ab - so kann ein Release
        # nicht versehentlich mit der vorherigen Beschreibung rausgehen.
        id: notes
        run: |
          NOTES_FILE="docs/release-notes/${GITHUB_REF_NAME}.md"
          FOOTER_FILE="docs/release-notes/_install_footer.md"
          if [ ! -f "$NOTES_FILE" ]; then
            echo "::error::Missing $NOTES_FILE - create it before tagging (see /CLAUDE.md release-checklist)."
            exit 1
          fi
          if [ ! -f "$FOOTER_FILE" ]; then
            echo "::error::Missing $FOOTER_FILE."
            exit 1
          fi
          {
            echo "body<<EOF_RELEASE_BODY"
            cat "$NOTES_FILE"
            echo
            cat "$FOOTER_FILE"
            echo "EOF_RELEASE_BODY"
          } >> "$GITHUB_OUTPUT"

      - name: Build and release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Tauri updater signing keys. Required so tauri-action emits the
          # signed `latest.json` manifest + `.app.tar.gz` bundle that the
          # in-app updater polls for. Set these as repo secrets:
          #   - TAURI_SIGNING_PRIVATE_KEY: contents of ~/.tauri/scriptz_updater.key
          #   - TAURI_SIGNING_PRIVATE_KEY_PASSWORD: password if the key has one
          #     (leave empty if generated with --no-password)
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: 'ScriptZ ${{ github.ref_name }}'
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: false
          prerelease: false
          projectPath: apps/desktop
          args: --target aarch64-apple-darwin

      - name: Trigger Vercel rebuild for landing
        # Vercel only rebuilds on git push, not on GitHub release events.
        # Without this, the landing keeps serving the previous version
        # until the next push to main, because its build-time fetch from
        # the GitHub Releases API ran before this release was published.
        # The deploy hook URL is created in Vercel under Project Settings
        # -> Git -> Deploy Hooks (branch: main).
        if: ${{ env.VERCEL_DEPLOY_HOOK_URL != '' }}
        env:
          VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
        run: curl -fsSL -X POST "$VERCEL_DEPLOY_HOOK_URL"
